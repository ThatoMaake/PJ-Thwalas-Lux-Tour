<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css.css">
    <title>Available Buses</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .container {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        header h1 {
            font-size: 2.5rem;
            color: #4CAF50;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Bus Schedule Table */
        .bus-schedule-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .bus-schedule-table th, .bus-schedule-table td {
            padding: 12px 20px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .bus-schedule-table th {
            background-color: #28a745;
            color: white;
        }

        .bus-schedule-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .bus-schedule-table td button {
            background-color: #28a745;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .bus-schedule-table td button:hover {
            background-color: #218838;
        }

        /* Cart Summary and Payment Forms */
        .cart-summary, .payment-form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .cart-summary ul {
            list-style-type: none;
            padding: 0;
        }

        .cart-summary li {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .cart-summary button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .cart-summary button:hover {
            background-color: #0056b3;
        }

        .payment-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .payment-form button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .payment-form button:hover {
            background-color: #218838;
        }

        /* Cart Popup Styling */
        .cart-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .cart-popup-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .cart-popup ul {
            list-style-type: none;
            padding: 0;
        }

        .cart-popup li {
            margin: 10px 0;
            font-size: 1rem;
        }

        .close-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
        }

        /* Footer Styling */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hello, <span id="user-name">User</span>!</h1>
            <p>Let's book you a safe bus trip.</p>
        </header>

        <!-- Bus Schedule Table -->
        <section id="bus-schedule">
            <h2>Available Bus Schedules</h2>
            <table class="bus-schedule-table">
                <thead>
                    <tr>
                        <th>Route</th>
                        <th>Time</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Bus data will be injected here by JavaScript -->
                </tbody>
            </table>
        </section>

        <section class="cart-summary" id="cart-summary">
            <h3>Booking Cart</h3>
            <ul id="cart-items"></ul>
            <p id="total-price">Total: R0</p>
            <button id="view-cart">View Cart</button>
        </section>

        <section class="payment-form" id="payment-form">
            <h3>Payment Details</h3>
            <form id="payment-form-content">
                <label for="card-number">Card Number:</label>
                <input type="text" id="card-number" name="card-number" required>

                <label for="expiry-date">Expiry Date:</label>
                <input type="text" id="expiry-date" name="expiry-date" required>

                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" required>

                <button type="submit">Pay Now</button>
            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2008 PJ Thwalas Lux Tours. All rights reserved.</p>
    </footer>

    <!-- Cart Popup -->
    <div class="cart-popup" id="cart-popup">
        <div class="cart-popup-content">
            <h3>Your Cart</h3>
            <ul id="cart-popup-items"></ul>
            <p id="cart-total-price">Total: R0</p>
            <button class="close-btn" id="close-cart-popup">Close</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Retrieve the user’s first name from localStorage (or session/cookies)
            const userName = localStorage.getItem('FirstName') || 'Guest';
            document.getElementById("user-name").textContent = userName;

            // Sample bus data with a fixed price
            const buses = [
                { route: "Malamulele-JHB", time: "07:00 AM", price: 350 },
                { route: "Giyani-Pretoria", time: "08:00 AM", price: 350 },
                { route: "Malamulele-JHB", time: "09:00 AM", price: 350 },
                { route: "Giyani-Pretoria", time: "06:00 AM", price: 350 }
            ];

            const busSection = document.getElementById("bus-schedule").getElementsByTagName("tbody")[0];
            const cartItems = document.getElementById("cart-items");
            const totalPriceElem = document.getElementById("total-price");
            const cartPopup = document.getElementById("cart-popup");
            const cartPopupItems = document.getElementById("cart-popup-items");
            const cartTotalPriceElem = document.getElementById("cart-total-price");

            let total = 0;
            let selectedBuses = [];

            function updateCart() {
                cartItems.innerHTML = '';
                cartPopupItems.innerHTML = '';
                total = 0;
                selectedBuses.forEach(bus => {
                    const listItem = document.createElement("li");
                    listItem.textContent = `${bus.route} - ${bus.time} - R${bus.price}`;
                    cartItems.appendChild(listItem);

                    const popupListItem = document.createElement("li");
                    popupListItem.textContent = `${bus.route} - ${bus.time} - R${bus.price}`;
                    cartPopupItems.appendChild(popupListItem);

                    total += bus.price;
                });
                totalPriceElem.textContent = `Total: R${total}`;
                cartTotalPriceElem.textContent = `Total: R${total}`;
            }

            function addBusToCart(index) {
                const bus = buses[index];
                // Check if the bus is already in the cart
                if (!selectedBuses.some(b => b.route === bus.route && b.time === bus.time)) {
                    selectedBuses.push(bus);
                    updateCart();
                }
            }

            buses.forEach((bus, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${bus.route}</td>
                    <td>${bus.time}</td>
                    <td>R${bus.price}</td>
                    <td><button onclick="addBusToCart(${index})">Add to Cart</button></td>
                `;
                busSection.appendChild(row);
            });

            // Show cart popup
            document.getElementById("view-cart").addEventListener('click', function() {
                cartPopup.style.display = 'flex';
            });

            // Close cart popup
            document.getElementById("close-cart-popup").addEventListener('click', function() {
                cartPopup.style.display = 'none';
            });
        });
    </script>
</body>
</html>
